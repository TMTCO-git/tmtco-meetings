<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meet — video calls</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap"
    rel="stylesheet"
  />

  <!-- RealtimeKit prebuilt UI components -->
  <script type="module">
    import { defineCustomElements } from 'https://cdn.jsdelivr.net/npm/@cloudflare/realtimekit-ui@latest/loader/index.es2017.js';
    defineCustomElements();
  </script>
  <!-- RealtimeKit core client -->
  <script src="https://cdn.jsdelivr.net/npm/@cloudflare/realtimekit@latest/dist/browser.js"></script>

  <link rel="stylesheet" href="/styles.css" />
</head>
<body>

  <div class="app" id="app">

    <!-- App switcher rail -->
    <nav class="rail" aria-label="App navigation">
      <div class="rail-mark" title="Meet">M</div>
      <button class="rail-btn is-active" title="Meet now">
        <svg viewBox="0 0 24 24" fill="none"><path d="M15 10.5V7a1.5 1.5 0 0 0-1.5-1.5h-9A1.5 1.5 0 0 0 3 7v10a1.5 1.5 0 0 0 1.5 1.5h9A1.5 1.5 0 0 0 15 17v-3.5l5 3.5V7l-5 3.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <span>Meet</span>
      </button>
      <button class="rail-btn" title="Chat (not available yet)" disabled>
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 5.5h16v10H8.5L4 19V5.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <span>Chat</span>
      </button>
      <button class="rail-btn" title="Teams (not available yet)" disabled>
        <svg viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="17" cy="8" r="2.4" stroke="currentColor" stroke-width="1.6"/><path d="M14.8 14.2c2.6.2 4.7 2 4.7 4.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span>Teams</span>
      </button>
      <button class="rail-btn" title="Calendar (not available yet)" disabled>
        <svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5" width="17" height="15" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 9.5h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span>Calendar</span>
      </button>
      <div class="rail-spacer"></div>
      <button class="rail-btn rail-avatar" id="avatarBtn" title="You">
        <span id="avatarInitial">?</span>
      </button>
    </nav>

    <!-- Lobby: create / join -->
    <main class="lobby" id="lobby">
      <header class="lobby-header">
        <div>
          <h1>Good to see you.</h1>
          <p class="lobby-sub">Start an instant call, or drop in on one already running.</p>
        </div>
        <div class="clock" id="clock" aria-hidden="true"></div>
      </header>

      <section class="name-card">
        <label for="displayName">Your name</label>
        <input id="displayName" type="text" maxlength="50" placeholder="e.g. Jordan Blake" autocomplete="name" />
      </section>

      <section class="actions">
        <button class="action-card action-card--primary" id="newMeetingBtn">
          <span class="action-icon">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </span>
          <span class="action-copy">
            <strong>New meeting</strong>
            <small>Create a call and invite others with a link</small>
          </span>
        </button>

        <form class="action-card" id="joinForm">
          <span class="action-icon action-icon--muted">
            <svg viewBox="0 0 24 24" fill="none"><path d="M4 6.5 12 12l8-5.5M4 6.5v11h16v-11" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          </span>
          <span class="action-copy">
            <strong>Join with a code</strong>
            <input id="joinCode" type="text" placeholder="Paste meeting code or link" autocomplete="off" />
          </span>
          <button type="submit" class="join-go" aria-label="Join meeting">Join</button>
        </form>
      </section>

      <section class="recents" id="recentsSection" hidden>
        <h2>Recent meetings</h2>
        <ul id="recentsList"></ul>
      </section>

      <p class="status-line" id="statusLine" role="status" aria-live="polite"></p>
    </main>

    <!-- Active call -->
    <section class="call-screen" id="callScreen" hidden>
      <header class="call-topbar">
        <div class="call-topbar-title">
          <span class="dot"></span>
          <span id="callTitle">Meeting</span>
        </div>
        <button class="copy-link-btn" id="copyLinkBtn">Copy invite link</button>
      </header>
      <rtk-meeting id="rtkMeeting" show-setup-screen="true"></rtk-meeting>
    </section>

  </div>

  <script src="/app.js"></script>
</body>
</html>
